name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            artifact: riglm-linux-x64
            ext: ''
          - target: linux-arm64
            os: ubuntu-latest
            artifact: riglm-linux-arm64
            ext: ''
          - target: darwin-x64
            os: macos-latest
            artifact: riglm-darwin-x64
            ext: ''
          - target: darwin-arm64
            os: macos-latest
            artifact: riglm-darwin-arm64
            ext: ''
          - target: windows-x64
            os: ubuntu-latest
            artifact: riglm-windows-x64
            ext: '.exe'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build standalone executable
        run: |
          bun build src/index.ts --compile --target=bun-${{ matrix.target }} --outfile dist/${{ matrix.artifact }}${{ matrix.ext }}

      - name: Create archive (Unix)
        if: matrix.ext == ''
        run: |
          cd dist
          chmod +x ${{ matrix.artifact }}
          tar -czvf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Create archive (Windows)
        if: matrix.ext == '.exe'
        run: |
          cd dist
          zip ${{ matrix.artifact }}.zip ${{ matrix.artifact }}${{ matrix.ext }}

      - name: Upload artifact (Unix)
        if: matrix.ext == ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz

      - name: Upload artifact (Windows)
        if: matrix.ext == '.exe'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
