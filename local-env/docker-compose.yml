version: '3.8'

services:
  ghostwheels:
    image: local/ghostwheels:current
    build:
      context: .
      dockerfile: local-env/Dockerfile
      args:
        - DEV_IMAGE_TAG=latest
    ports:
      - "56667:56667"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    user: "appuser:appgroup"
    networks:
      - mcp-net

  mcp-inspector:
    build:
      context: .
      dockerfile: Dockerfile.inspector
    ports:
      - "6274:6274"
      - "6277:6277"
    volumes:
      - ./inspector:/app/data
    environment:
      - CLIENT_PORT=6274
      - SERVER_PORT=6277
    restart: unless-stopped
    networks:
      - mcp-net
    extra_hosts:
      - "localhost:host-gateway"

networks:
  mcp-net:
    name: mcp-net
    driver: bridge
