services:
  abc-server:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    ports:
      - "56667:56667"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    user: "appuser:appgroup"
    networks:
      - mcp-net

  mcp-inspector:
    build:
      context: .
      dockerfile: Dockerfile.inspector
    ports:
      - "6274:6274"
      - "6277:6277"
    environment:
      - CLIENT_PORT=6274
      - SERVER_PORT=6277
    restart: unless-stopped
    networks:
      - mcp-net
    extra_hosts:
      - "localhost:host-gateway"

networks:
  mcp-net:
    name: mcp-net
    driver: bridge